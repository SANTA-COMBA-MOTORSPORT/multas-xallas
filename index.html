<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multas Xallas FC</title>
<meta name="theme-color" content="#00612D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multas Xallas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #00612D; overflow: hidden; }
  /* Pantalla de carga co escudo mentres arranca a app */
  .splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; color: #fff;
    font: 600 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .splash img { width: 110px; height: auto; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); }
  .splash i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; animation: g .8s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="splash"><img src="escudo.png" alt="Xallas FC"><span>Xallas FC · Multas</span><i></i></div>
  <!-- ⬇️ URL da aplicación web de Apps Script (a que remata en /exec) -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbxqznmfNETESHemD28SExzgG7ypAh-O4_8gM8-gERc2fCe-wgavFNN1LkXzHv8rp2M/exec" title="Multas Xallas FC" allow="clipboard-write"></iframe>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    // Pide ao navegador que non borre os datos desta páxina (a sesión)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

    // Garda a sesión da app aquí, na páxina principal. No iPhone, Safari borra o que gardan
    // os iframes de Google cada vez que se pecha a app, pero isto si o conserva.
    var KEY = 'xfc_token';
    function deGoogle(origin) { try { return /(^|\.)googleusercontent\.com$/.test(new URL(origin).hostname); } catch (e) { return false; } }
    window.addEventListener('message', function (e) {
      if (!deGoogle(e.origin) || !e.data || typeof e.data !== 'object') return;
      if (e.data.xfc === 'get') {
        var t = null; try { t = localStorage.getItem(KEY); } catch (_) {}
        if (e.source) e.source.postMessage({ xfc: 'token', token: t }, e.origin);
      } else if (e.data.xfc === 'set') {
        try { if (e.data.token) localStorage.setItem(KEY, String(e.data.token)); else localStorage.removeItem(KEY); } catch (_) {}
      }
    });
  </script>
</body>
</html>
